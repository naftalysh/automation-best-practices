version: '3'
services:
  # The Selenium Hub service
  selenium-hub:
    image: selenium/hub
    container_name: selenium-hub
    ports:
      - "4444:4444"
    networks:
      - selenium-grid

  # Chrome Node 1
  node-chrome:
    image: selenium/node-chrome
    container_name: node-chrome
    environment:
      # Setting up environment variables for event bus communication
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    networks:
      - selenium-grid
    volumes:
      # Volume for storing screenshots
      - chrome-screenshots:/screenshots
      # Volume for storing logs
      - chrome-logs:/var/log/selenium

  # Firefox Node 1
  node-firefox:
    image: selenium/node-firefox
    container_name: node-firefox
    environment:
      # Setting up environment variables for event bus communication
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    networks:
      - selenium-grid
    volumes:
      # Volume for storing screenshots
      - firefox-screenshots:/screenshots
      # Volume for storing logs
      - firefox-logs:/var/log/selenium

networks:
  selenium-grid:

volumes:
  chrome-screenshots:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /path/to/local/chrome-screenshots
  chrome-logs:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /path/to/local/chrome-logs
  firefox-screenshots:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /path/to/local/firefox-screenshots
  firefox-logs:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /path/to/local/firefox-logs
